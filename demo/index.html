<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Acme Analytics</title>
<style>
  * { margin:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
  body { background:#f4f6fb; height:100vh; display:flex; flex-direction:column; }
  nav { background:#101828; color:#fff; display:flex; align-items:center; padding:0 24px; gap:8px; height:56px; }
  .logo { font-weight:700; font-size:17px; margin-right:24px; }
  .tab { padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; color:#cbd5e1; }
  .tab.active { background:#1e293b; color:#fff; }
  main { flex:1; padding:28px; overflow:auto; }
  h1 { font-size:22px; color:#0f172a; margin-bottom:4px; }
  .sub { color:#64748b; font-size:13px; margin-bottom:20px; }
  .row { display:flex; gap:16px; margin-bottom:16px; }
  .card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(15,23,42,.08); flex:1; }
  .kpi { font-size:26px; font-weight:700; color:#0f172a; margin-top:6px; }
  .label { font-size:12px; color:#64748b; text-transform:uppercase; letter-spacing:.05em; }
  .delta { font-size:12px; margin-top:4px; }
  .up { color:#16a34a } .down { color:#dc2626 }
  .actions { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  button { border:0; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(15,23,42,.15); }
  .primary { background:#2563eb; color:#fff; }
  .ghost { background:#e2e8f0; color:#334155; }
  .bars { display:flex; gap:10px; align-items:flex-end; height:140px; padding-top:10px; }
  .bar { width:36px; background:linear-gradient(180deg,#60a5fa,#2563eb); border-radius:6px 6px 0 0; transition:height .5s cubic-bezier(.22,1,.36,1); }
  #toast { position:fixed; bottom:24px; right:24px; background:#0f172a; color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; }
  #toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<nav id="nav">
  <span class="logo">◆ Acme Analytics</span>
  <div class="tab active" data-tab="Overview">Overview</div>
  <div class="tab" data-tab="Reports">Reports</div>
  <div class="tab" data-tab="Alerts">Alerts</div>
</nav>
<main>
  <h1 id="title">Overview</h1>
  <p class="sub">Live product metrics · updated just now</p>
  <div class="actions">
    <button class="primary" id="deploy">Deploy to production</button>
    <button class="ghost" id="refresh">Refresh data</button>
  </div>
  <div class="row">
    <div class="card"><div class="label">Active users</div><div class="kpi" id="users">12,482</div><div class="delta up">▲ 8.2% vs last week</div></div>
    <div class="card"><div class="label">Revenue</div><div class="kpi" id="rev">$48.9k</div><div class="delta up">▲ 3.1%</div></div>
    <div class="card"><div class="label">Error rate</div><div class="kpi" id="err">0.42%</div><div class="delta down">▲ 0.04%</div></div>
  </div>
  <div class="card">
    <div class="label">Deploys per day</div>
    <div class="bars" id="bars"></div>
  </div>
</main>
<div id="toast"></div>
<script>
const bars = document.getElementById('bars')
function renderBars(seed) {
  bars.innerHTML = ''
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('div')
    b.className = 'bar'
    const v = 30 + ((Math.sin(seed + i * 1.7) + 1) / 2) * 100
    requestAnimationFrame(() => { b.style.height = v + '%' })
    bars.appendChild(b)
  }
}
renderBars(0)
let seed = 0
const toast = document.getElementById('toast')
function showToast(msg) {
  toast.textContent = msg
  toast.classList.add('show')
  setTimeout(() => toast.classList.remove('show'), 2200)
}
document.getElementById('deploy').onclick = () => { seed += 2; renderBars(seed); showToast('✅ Deploy succeeded — build #418 live') }
document.getElementById('refresh').onclick = () => { seed += 1; renderBars(seed); showToast('⟳ Data refreshed') }
document.getElementById('nav').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab')
  if (!tab) return
  document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'))
  tab.classList.add('active')
  document.getElementById('title').textContent = tab.dataset.tab
})
</script>
</body>
</html>
