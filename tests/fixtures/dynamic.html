<!doctype html><html><head><meta charset="utf-8"><title>Meridian — Release Notes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17293a;font:18px Arial,sans-serif}header{padding:35px 7%;background:#17293a;color:white}main{max-width:980px;margin:45px auto;padding:0 25px}h1{font-size:38px;margin:0 0 12px}p{color:#6a7a88;line-height:1.7}.panel{padding:32px;background:white;border-radius:20px;box-shadow:0 8px 40px #2030400b}button{border:0;border-radius:10px;background:#267b77;color:white;font:600 17px Arial;padding:16px 24px;cursor:pointer}input{display:block;padding:14px;margin:18px 0;width:100%;font:20px Arial;border:2px solid #d9e2e8;border-radius:8px}#composer{display:none;margin-top:24px}#status{margin-top:28px;color:#267b77;font-weight:bold}#bottom{margin-top:650px;padding:32px;background:white;border-radius:20px}#finish{background:#253f66}#done{font-weight:bold;color:#267b77}#footer{height:160px}
</style></head><body><header>MERIDIAN / PRODUCT WORKSPACE</header><main><h1>Publish with confidence.</h1><p>A small release workflow with a changing layout, text entry, and scrolling.</p><section class="panel"><button id="open">Write a release note</button><div id="composer"><label for="name">Release title</label><input id="name" placeholder="What changed?"></div><div id="status">Ready for a new release</div></section><section id="bottom"><h2>Ready to share?</h2><p>Review the saved release and publish it to your team.</p><button id="finish">Publish release</button><p id="done">Waiting for a saved release</p></section><div id="footer"></div></main>
<script>
document.querySelector('#open').onclick=()=>{document.querySelector('#composer').style.display='block';if(!document.querySelector('#save')){const b=document.createElement('button');b.id='save';b.textContent='Save release';document.querySelector('#composer').append(b);b.onclick=()=>{document.querySelector('#status').textContent='Saved: '+document.querySelector('#name').value;setTimeout(()=>b.style.marginLeft='220px',100)}}};
document.querySelector('#finish').onclick=()=>document.querySelector('#done').textContent='Published to the team';
</script></body></html>
